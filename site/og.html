<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <title>OGP画像ソース — UniEnter</title>
    <meta name="robots" content="noindex" />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: #ffffff;
        font-family:
          -apple-system,
          BlinkMacSystemFont,
          "Hiragino Sans",
          "Hiragino Kaku Gothic ProN",
          sans-serif;
        color: #37352f;
      }
      .canvas {
        width: 1200px;
        height: 630px;
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 0 80px;
      }
      .mark {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 26px;
        font-weight: 600;
        color: #6b6a66;
        margin-bottom: 28px;
      }
      .mark .glyph {
        font-size: 30px;
        font-weight: 400;
        color: #9a9994;
      }
      h1 {
        font-size: 62px;
        font-weight: 700;
        line-height: 1.32;
        text-align: center;
        letter-spacing: 0.01em;
      }
      .keys {
        display: flex;
        align-items: center;
        gap: 22px;
        margin-top: 56px;
        font-size: 40px;
        font-weight: 700;
      }
      .keycap {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        border: 2px solid #e4e2dd;
        background: #fbfaf8;
        border-radius: 12px;
        padding: 14px 26px;
        font-size: 34px;
        font-weight: 600;
        color: #37352f;
        box-shadow: 0 2px 0 rgba(55, 53, 47, 0.06);
      }
      .arrow {
        color: #b6b4ad;
        font-size: 34px;
      }
      .result-newline {
        color: #0f7b6c;
      }
      .result-send {
        color: #37352f;
      }
      .footline {
        margin-top: 64px;
        font-size: 25px;
        font-weight: 500;
        color: #6b6a66;
        white-space: nowrap;
        text-align: center;
      }
      .footline .sep {
        margin: 0 14px;
        color: #d8d6d0;
      }
    </style>
  </head>
  <body>
    <div class="canvas">
      <div class="mark"><span class="glyph">&#8629;</span> UniEnter</div>
      <h1>Enterで送信するのは、<br />もう終わり。</h1>
      <div class="keys">
        <span class="keycap">Enter</span>
        <span class="arrow">&rarr;</span>
        <span class="result-newline">改行</span>
        <span style="width: 28px"></span>
        <span class="keycap">&#8984; Enter</span>
        <span class="arrow">&rarr;</span>
        <span class="result-send">送信</span>
      </div>
      <div class="footline">
        Slack・Teams・Discord・LINE・ChatGPT・Claude ほか<span class="sep">|</span>macOS用・14日間無料トライアル
      </div>
    </div>
  </body>
</html>
