name = "unienter-license"
main = "worker.js"
compatibility_date = "2026-07-01"

# `wrangler kv namespace create LICENSES` で作成したID(2026-09-29作成)
[[kv_namespaces]]
binding = "LICENSES"
id = "ccddd38e76424e3abd597ff6fc2e5ee8"

[vars]
# 本番有効化は送信元の検証と送信範囲の承認後に行う。既存注文は自動再送しない。
LICENSE_EMAIL_ENABLED = "true"
# 受信確認後の有効化境界。過去注文の遅延Webhookも自動送信しない。
LICENSE_EMAIL_START_AT = "2026-10-06T06:33:09Z"
# 本番: https://api.polar.sh / サンドボックス: https://sandbox-api.polar.sh
POLAR_API_BASE = "https://api.polar.sh"
# LicenseManager.publicKeyBase64 と同値(公開情報)
LICENSE_PUBLIC_KEY = "GnuD4CdMgZHXooBnItp7HxOZUQD7Ai/fURl0oqidhXk="
# Resend利用時のみ(ドメイン認証済みの送信元)
MAIL_FROM = "UniEnter <licenses@notify.oc-to.com>"
MAIL_REPLY_TO = "info@oc-to.com"
