<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!--
    UniEnter app icon -- variant A (mono).
    White rounded-square tile, ink return-arrow glyph. Matches
    site/public/favicon.svg's geometry (same 64x64 glyph box), scaled
    onto the standard macOS icon grid: tile 824/1024 of canvas, corner
    radius 185/1024, centered (100px margin on each side at 1024).
    This SVG is a design reference; the installed PNGs are rendered by
    render.swift for pixel-exact control (see README.md).
  -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="#ffffff"/>
  <g fill="none" stroke="#37352f" stroke-width="77.25" stroke-linecap="round" stroke-linejoin="round">
    <path d="M679.375 370.375 V550.625 H344.625"/>
    <path d="M447.625 447.625 344.625 550.625 447.625 653.625"/>
  </g>
</svg>
