name: UniEnter
options:
  bundleIdPrefix: dev.iwai
  developmentLanguage: ja
  deploymentTarget:
    macOS: "13.0"
packages:
  # アプリ内アップデート(ユーザーが「アップデートを確認…」を押したときだけ通信する)
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.6.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    CODE_SIGN_STYLE: Manual
    # Apple Development証明書(ハッシュ指定)。ad-hoc署名("-")はビルドごとに
    # 署名が変わりTCC(アクセシビリティ許可)が無効化されるため使わない。
    CODE_SIGN_IDENTITY: "D24D0257C11BEBF3858CF1A8755F6A5D8E41BF9D"
targets:
  UniEnter:
    type: application
    platform: macOS
    sources: [UniEnter]
    info:
      path: UniEnter/Info.plist
      properties:
        CFBundleDisplayName: UniEnter
        # 日本語アプリとして宣言する。これが無いと Sparkle(アップデート画面)や入力欄の
        # 右クリックメニューなど、システム・ライブラリ側の文言が英語で表示される
        CFBundleDevelopmentRegion: ja
        CFBundleLocalizations: [ja]
        CFBundleShortVersionString: "0.3.6"
        CFBundleVersion: "13"
        LSUIElement: true
        NSPrincipalClass: NSApplication
        NSHumanReadableCopyright: "© 2026 octo (oc-to.com)"
        # Sparkle: 自動確認・自動インストール・システム情報の送信はすべてしない。
        # 通信は「アップデートを確認…」を押したときの appcast 取得と更新ファイルのダウンロードだけ
        SUFeedURL: https://unienter.oc-to.com/appcast.xml
        SUPublicEDKey: "OepC/ZJSLtD5bn2gZ4tLbtLAOnetlnh9OLTg1IZtWQg="
        SUEnableAutomaticChecks: false
        SUAllowsAutomaticUpdates: false
        SUEnableSystemProfiling: false
    dependencies:
      - package: Sparkle
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.iwai.UniEnter
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
      configs:
        # 配布用は Developer ID で署名して公証する(DEVELOPMENT_TEAM は scripts/release.sh が証明書から渡す)。
        # Debug は上の Apple Development 固定のまま(開発中のTCC許可を維持するため)
        Release:
          CODE_SIGN_IDENTITY: "Developer ID Application"
          OTHER_CODE_SIGN_FLAGS: "--timestamp"
          # デバッガ接続用の get-task-allow が入ると公証で弾かれる
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
    scheme:
      testTargets: [UniEnterTests]
  UniEnterTests:
    type: bundle.unit-test
    platform: macOS
    sources: [UniEnterTests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: UniEnter
