name: Windows prototype compile smoke
on:
  push:
    branches: [codex/windows-compile-smoke]
    paths:
      - .github/workflows/windows-compile.yml
      - experiments/windows-prototype/**
permissions:
  contents: read
concurrency:
  group: windows-prototype-compile
  cancel-in-progress: false
jobs:
  compile:
    runs-on: windows-2025
    timeout-minutes: 10
    defaults:
      run:
        working-directory: experiments/windows-prototype
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 resolved 2026-10-07
        with:
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout: experiments/windows-prototype
      - name: Build x64, run core tests and noninteractive COM smoke
        shell: cmd
        run: scripts\ci-windows.cmd
